name: PT-BR message validation

on:
  push:
    paths:
      - "ports/soh/ptbr/**"
      - "ports/soh/validate_ptbr.py"
      - ".github/workflows/ptbr-validation.yml"
  pull_request:
    paths:
      - "ports/soh/ptbr/**"
      - "ports/soh/validate_ptbr.py"
      - ".github/workflows/ptbr-validation.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate message IDs and control tokens
        run: python -m ports.soh.validate_ptbr
      - name: Check Python syntax
        run: python -m py_compile ports/soh/port_patches.py ports/soh/validate_ptbr.py
